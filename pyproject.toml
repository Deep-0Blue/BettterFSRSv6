[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bettter-fsrs"
version = "0.1.0"
description = "Anki revlog parsing and FSRS-6 benchmarking with personalized optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
optimize = ["scipy>=1.11"]
dev = ["pytest>=8.0", "scipy>=1.11"]

[project.scripts]
bettter-fsrs-benchmark = "bettter_fsrs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bettter_fsrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
